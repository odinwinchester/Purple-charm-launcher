name: Preparar chave permanente (execução única)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite exatamente CREATE_PERMANENT_KEY após configurar o environment'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: purple-signing-key-generation
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'CREATE_PERMANENT_KEY' }}
    runs-on: ubuntu-24.04
    environment: android-signing
    timeout-minutes: 15
    steps:
      - name: Checkout do código confiável
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bloquear segunda geração se já houver resultado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior_runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/generate-signing-keystore.yml/runs?per_page=100" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id" | wc -l | tr -d ' ')"
          prior_artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=Purple-Charm-Encrypted-Signing-Backup&per_page=100" --jq '.total_count')"
          test "$prior_runs" = "0" && test "$prior_artifacts" = "0" || {
            echo "Geração anterior detectada; bloqueando nova chave para preservar o fingerprint."
            exit 1
          }
      - name: Instalar biblioteca criptográfica sem secrets
        run: python3 -m pip install --disable-pip-version-check --no-warn-script-location "cryptography==50.0.2"
      - name: Validar segredos e preparar senhas em arquivos privados
        env:
          EXISTING_CIPHERTEXT: ${{ secrets.PURPLE_KEYSTORE_CIPHERTEXT_B64 }}
          STORE_PASSWORD: ${{ secrets.PURPLE_STORE_PASSWORD }}
          PROTECTION_ACK: ${{ vars.PURPLE_SIGNING_ENVIRONMENT_PROTECTED }}
        run: |
          set -euo pipefail
          test "$PROTECTION_ACK" = "YES" || { echo "Environment não foi confirmado como protegido; geração bloqueada."; exit 1; }
          test -z "$EXISTING_CIPHERTEXT" || { echo "Chave já provisionada; geração bloqueada."; exit 1; }
          test -n "$STORE_PASSWORD" && test "${#STORE_PASSWORD}" -ge 20 || {
            echo "PURPLE_STORE_PASSWORD ausente ou curta; use uma senha longa e exclusiva (mínimo 20 caracteres)."
            exit 1
          }
          umask 077
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          chmod 600 "$RUNNER_TEMP/store.pass"
      - name: Gerar JKS e criar somente recuperação autenticada cifrada
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/purple-release.jks"
          EXPORT="$RUNNER_TEMP/purple-signing-export"
          KEY_ALIAS="purple-charm-release"
          mkdir -p "$EXPORT"
          keytool -genkeypair -noprompt -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 10000 \
            -keystore "$KEYSTORE" -storetype JKS -dname "CN=Purple Charm Crystal Class, OU=Android, O=Purple Charm" \
            -storepass:file "$RUNNER_TEMP/store.pass" -keypass:file "$RUNNER_TEMP/store.pass" >/dev/null 2>&1
          keytool -exportcert -alias "$KEY_ALIAS" -keystore "$KEYSTORE" \
            -storepass:file "$RUNNER_TEMP/store.pass" -file "$RUNNER_TEMP/certificate.der" >/dev/null 2>&1
          FINGERPRINT="$(openssl dgst -sha256 "$RUNNER_TEMP/certificate.der" | awk '{print tolower($NF)}')"
          [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/keystore_crypto.py encrypt "$KEYSTORE" "$EXPORT/keystore-backup.pccks" --passphrase-file "$RUNNER_TEMP/store.pass"
          base64 -w0 "$EXPORT/keystore-backup.pccks" > "$EXPORT/keystore-backup.base64.txt"
          printf '%s\n' "$FINGERPRINT" > "$EXPORT/certificate.sha256"
          chmod 600 "$EXPORT/"*
          {
            echo "### Chave permanente gerada"
            echo
            echo "Fingerprint SHA-256 público: $FINGERPRINT"
            echo
            echo "O artefato contém somente ciphertext AES-256-GCM autenticado, Base64 do ciphertext e fingerprint público."
            echo "A mesma senha PURPLE_STORE_PASSWORD protege keystore e backup; copie keystore-backup.base64.txt para o secret PURPLE_KEYSTORE_CIPHERTEXT_B64 e salve keystore-backup.pccks em backup privado."
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for name in ("purple-release.jks", "certificate.der"):
              p = root / name
              if p.exists():
                  p.unlink()
          PY
      - name: Publicar somente arquivos cifrados
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Charm-Encrypted-Signing-Backup
          path: |
            ${{ runner.temp }}/purple-signing-export/keystore-backup.pccks
            ${{ runner.temp }}/purple-signing-export/keystore-backup.base64.txt
            ${{ runner.temp }}/purple-signing-export/certificate.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Limpar temporários confidenciais
        if: always()
        run: |
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for name in ("purple-release.jks", "certificate.der", "store.pass"):
              p = root / name
              if p.exists():
                  p.unlink()
          PY
