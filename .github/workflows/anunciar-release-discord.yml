name: Anunciar versão estável no Discord

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: discord-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  anunciar:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft && startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código confiável da branch padrão
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Publicar somente release aprovada, com trava contra duplicação
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/discord_release_bot.py
