name: Anunciar versao estavel no Discord

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  anunciar:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft && startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verificar APK da release
        id: apk
        env:
          RELEASE_JSON: ${{ toJSON(github.event.release) }}
        run: |
          python3 - <<'PY'
          import json, os
          release = json.loads(os.environ["RELEASE_JSON"])
          assets = [a for a in release.get("assets", []) if a["name"].lower().endswith(".apk")]
          if not assets:
              raise SystemExit("Release sem APK: anuncio cancelado.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("url=" + assets[0]["browser_download_url"] + "\n")
          PY

      - name: Publicar anuncio no Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          APK_URL: ${{ steps.apk.outputs.url }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit("Secret DISCORD_WEBHOOK_URL nao configurado.")
          name = os.environ.get("RELEASE_NAME") or os.environ["RELEASE_TAG"]
          tag = os.environ["RELEASE_TAG"]
          content = ("💜 **Purple Charm Crystal Glass — versão estável publicada**\n"
                     f"**Versão:** {tag}\n"
                     f"**Lançamento:** {os.environ['RELEASE_URL']}\n"
                     f"**Baixar APK:** {os.environ['APK_URL']}\n"
                     "Versão oficial publicada após homologação.")
          req = urllib.request.Request(webhook,
              data=json.dumps({"content": content, "allowed_mentions": {"parse": []}}).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "PurpleCharmRelease/1.0"},
              method="POST")
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status not in (200, 204):
                  raise SystemExit(f"Discord HTTP {response.status}")
          print("Anuncio publicado.")
          PY
