name: Anunciar versão estável no Discord

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'ID de uma GitHub Release aprovada'
        required: true
        type: string
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
    secrets:
      discord_webhook_url:
        required: true

permissions:
  contents: write

concurrency:
  group: discord-release-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  anunciar:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código confiável da branch padrão
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Publicar somente release aprovada, com trava contra duplicação
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.discord_webhook_url || secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/discord_release_bot.py
