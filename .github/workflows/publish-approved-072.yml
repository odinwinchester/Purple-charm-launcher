name: Publicar APK 0.7.2 homologado (sem recompilar)

on:
  workflow_dispatch:
    inputs:
      stable_run_id:
        description: 'ID da execução aprovada de APK estável assinado'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: purple-publish-approved-072
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: write
      actions: read
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Validar autorização e origem
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.stable_run_id }}
          PROTECTED: ${{ vars.PURPLE_RELEASE_ENVIRONMENT_PROTECTED }}
          APPROVED_SHA: 105ed722319c896b5d30cf39fafea5978fa5b33b
        run: |
          set -euo pipefail
          test "$PROTECTED" = YES
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$APPROVED_SHA...$GITHUB_SHA" > "$RUNNER_TEMP/compare.json"
          python3 - "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/compare.json" "$APPROVED_SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          comparison=json.load(open(sys.argv[2]))
          assert comparison["status"] in ("ahead","identical"), "Commit aprovado não pertence à main atual"
          assert r["name"]=="APK estável assinado (android-signing)"
          assert r["conclusion"]=="success" and r["head_branch"]=="main"
          assert r["head_sha"]==sys.argv[3], "A execução assinada deve corresponder ao commit aprovado"
          print("Origem, branch e commit da compilação conferidos.")
          PY
      - name: Baixar somente o artefato aprovado
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.stable_run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name Purple-Charm-Stable-APK --dir dist
      - name: Validar identidade e integridade do APK
        env:
          EXPECTED_CERT: ${{ vars.PURPLE_SIGNING_CERT_SHA256 }}
          APPROVED_SHA: 105ed722319c896b5d30cf39fafea5978fa5b33b
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          p=pathlib.Path("dist/Purple-Charm-Crystal-Class-v0.7.2-STABLE.apk")
          m=json.loads(pathlib.Path("dist/release-metadata.json").read_text())
          assert p.is_file() and p.stat().st_size>0
          assert m["version"]=="0.7.2" and m["versionCode"]==9
          assert m["applicationId"]=="com.purplecharm.launcher"
          assert m["commit"]==os.environ["APPROVED_SHA"]
          assert m["signatureType"]=="STABLE_RELEASE"
          assert m["validation"]["status"]=="passed"
          assert m["validation"]["unitTests"]>=107
          assert m["validation"]["failures"]==0 and m["validation"]["skipped"]==0
          assert m["apkSha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          cert=os.environ["EXPECTED_CERT"].replace(":","").lower()
          assert re.fullmatch(r"[0-9a-f]{64}",cert)
          assert m["certificateSha256"].lower()==cert
          print("Metadados, SHA-256 do APK e certificado aprovado conferidos.")
          PY
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose --print-certs dist/*.apk > "$RUNNER_TEMP/signature.txt"
          python3 - "$RUNNER_TEMP/signature.txt" <<'PY'
          import os,pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          actual={x.lower() for x in re.findall(r"certificate SHA-256 digest: ([0-9a-fA-F]+)",s)}
          assert actual=={os.environ["EXPECTED_CERT"].replace(":","").lower()}
          print("Assinatura criptográfica do APK validada.")
          PY
      - name: Criar GitHub Release pública somente após aprovação
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: 105ed722319c896b5d30cf39fafea5978fa5b33b
        run: |
          set -euo pipefail
          if gh release view v0.7.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.7.2 já existe; publicação duplicada bloqueada."
            exit 1
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Purple Charm Crystal Class 0.7.2 — APK estável assinado e homologado no POCO.

          - versionCode: 9
          - Segunda tela meteorológica, castelo, Fumê e Vazado
          - Temperatura e previsão meteorológica
          - Personalização avançada e ajustes dos widgets ainda pendentes
          - Integridade e certificado: release-metadata.json

          <!-- purple-charm-release-approved -->
          EOF
          gh release create v0.7.2 --repo "$GITHUB_REPOSITORY" dist/Purple-Charm-Crystal-Class-v0.7.2-STABLE.apk dist/release-metadata.json \
            --title "Purple Charm Crystal Class v0.7.2" --notes-file "$RUNNER_TEMP/notes.md" --target "$APPROVED_SHA"
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.2" --jq '.id')"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  announce:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/anunciar-release-discord.yml
    with:
      release_id: ${{ needs.publish.outputs.release_id }}
    secrets:
      discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
