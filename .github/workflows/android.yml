name: Compilar Purple Charm Launcher

on:
  push:
    branches: [main, "development/v12-continuacao"]
  pull_request:
    branches: [main, "codex/weather-widgets"]
  workflow_dispatch:

jobs:
  safe-selftests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir integridade dos 80 recursos e das 26 artes
        run: python3 scripts/verify_weather_artwork.py

      - name: Testar arraste, pastas, previsão e layout
        run: gradle clean :app:testDebugUnitTest --stacktrace

      - name: Disponibilizar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Charm-Test-Reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

      - name: Conferir resultados dos testes
        run: |
          python3 - <<'PYTEST'
          import glob
          import xml.etree.ElementTree as ET
          suites = [ET.parse(path).getroot() for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          total = sum(int(s.get('tests', 0)) for s in suites)
          failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) + int(s.get('skipped', 0)) for s in suites)
          assert total >= 107 and failures == 0, (total, failures)
          print(f'{total} testes executados, sem falhas, erros ou testes ignorados.')
          PYTEST

  signed-release:
    name: APK oficial assinado
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: safe-selftests
    runs-on: ubuntu-24.04
    environment: android-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar chave oficial e validar certificado
        shell: bash
        env:
          KEYSTORE_CIPHERTEXT_B64: ${{ secrets.PURPLE_KEYSTORE_CIPHERTEXT_B64 }}
          STORE_PASSWORD: ${{ secrets.PURPLE_STORE_PASSWORD }}
          EXPECTED_CERT: ${{ vars.PURPLE_SIGNING_CERT_SHA256 }}
          PROTECTION_ACK: ${{ vars.PURPLE_SIGNING_ENVIRONMENT_PROTECTED }}
        run: |
          set -euo pipefail
          test "$PROTECTION_ACK" = "YES"
          test -n "$KEYSTORE_CIPHERTEXT_B64"
          test "${#STORE_PASSWORD}" -ge 20
          EXPECTED_CERT="$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ]]
          echo "::add-mask::$STORE_PASSWORD"
          umask 077
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$KEYSTORE_CIPHERTEXT_B64" | base64 --decode > "$RUNNER_TEMP/keystore.pccks"
          python3 -m pip install --disable-pip-version-check "cryptography==50.0.2"
          python3 scripts/keystore_crypto.py decrypt "$RUNNER_TEMP/keystore.pccks" "$RUNNER_TEMP/purple-release.jks" --passphrase-file "$RUNNER_TEMP/store.pass"
          keytool -exportcert -alias purple-charm-release -keystore "$RUNNER_TEMP/purple-release.jks" -storepass:file "$RUNNER_TEMP/store.pass" -file "$RUNNER_TEMP/cert.der" >/dev/null 2>&1
          ACTUAL_CERT="$(openssl dgst -sha256 "$RUNNER_TEMP/cert.der" | awk '{print tolower($NF)}')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          echo "PURPLE_KEYSTORE_PATH=$RUNNER_TEMP/purple-release.jks" >> "$GITHUB_ENV"
          echo "PURPLE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PURPLE_VERSION_CODE=12" >> "$GITHUB_ENV"
          echo "EXPECTED_SIGNING_CERT=$EXPECTED_CERT" >> "$GITHUB_ENV"
      - name: Compilar release com assinatura oficial
        run: gradle :app:assembleRelease --stacktrace
      - name: Validar APK e certificado oficial
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          # Versoes do Android SDK usam nomes distintos (ex.: "V2 Signer" ou "Signer #1").
          # Extrair apenas o SHA-256 do certificado; rejeitar duplicatas e resultados invalidos.
          CERT_OUTPUT="$("$SDK_BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          CERT_DIGESTS="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/^.*[Cc]ertificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+)[[:space:]]*$/\1/p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)"
          ACTUAL_CERT="$CERT_DIGESTS"
          if [[ ! "$ACTUAL_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Falha ao ler um unico digest SHA-256 valido do certificado do APK."
            exit 1
          fi
          test "$ACTUAL_CERT" = "$EXPECTED_SIGNING_CERT" || { echo "Certificado do APK não corresponde ao certificado oficial esperado."; exit 1; }
          BADGING="$("$SDK_BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "versionCode='12'" || { echo "versionCode incorreto."; exit 1; }
          printf '%s\n' "$BADGING" | grep -q "package: name='com.purplecharm.launcher'" || { echo "applicationId incorreto."; exit 1; }
          mkdir -p dist
          cp "$APK" dist/Purple-Charm-v12-OFFICIAL-RELEASE.apk
      - name: Publicar APK oficial
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Charm-v12-OFFICIAL-RELEASE
          path: dist/Purple-Charm-v12-OFFICIAL-RELEASE.apk
          if-no-files-found: error
      - name: Apagar chave e senha temporárias
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/purple-release.jks" "$RUNNER_TEMP/keystore.pccks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/cert.der"
