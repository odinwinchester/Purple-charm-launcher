name: Compilar Purple Charm Launcher

on:
  push:
    branches: [main, "development/v12-continuacao"]
  pull_request:
    branches: [main, "codex/weather-widgets"]
  workflow_dispatch:
    inputs:
      sign_candidate:
        description: Assinar o candidato v15 sem criar Release
        type: boolean
        default: false

      publish_existing_v15:
        description: Publicar APK v15 previamente assinado, sem recompilar
        type: boolean
        default: false

jobs:
  safe-selftests:
    if: ${{ inputs.publish_existing_v15 != true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir integridade dos 80 recursos e das 26 artes
        run: python3 scripts/verify_weather_artwork.py

      - name: Testar arraste, pastas, previsão e layout
        run: gradle clean :app:testDebugUnitTest --stacktrace

      - name: Compilar APK debug para testes de dispositivo
        run: gradle :app:assembleDebug --stacktrace

      - name: Validar metadados v14 do APK debug
        if: ${{ github.ref == 'refs/heads/development/v12-continuacao' }}
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.purplecharm.launcher' versionCode='14' versionName='14'"

      - name: Disponibilizar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Charm-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Disponibilizar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Charm-Test-Reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

      - name: Conferir resultados dos testes
        run: |
          python3 - <<'PYTEST'
          import glob
          import xml.etree.ElementTree as ET
          suites = [ET.parse(path).getroot() for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          total = sum(int(s.get('tests', 0)) for s in suites)
          failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) + int(s.get('skipped', 0)) for s in suites)
          assert total >= 107 and failures == 0, (total, failures)
          print(f'{total} testes executados, sem falhas, erros ou testes ignorados.')
          PYTEST

  signed-release:
    name: APK oficial assinado
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development/v15-performance' && inputs.sign_candidate == true) }}
    needs: safe-selftests
    env:
      CANDIDATE_VERSION: ${{ github.ref == 'refs/heads/main' && '14' || '15' }}
    runs-on: ubuntu-24.04
    environment: android-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar chave oficial e validar certificado
        shell: bash
        env:
          KEYSTORE_CIPHERTEXT_B64: ${{ secrets.PURPLE_KEYSTORE_CIPHERTEXT_B64 }}
          STORE_PASSWORD: ${{ secrets.PURPLE_STORE_PASSWORD }}
          EXPECTED_CERT: ${{ vars.PURPLE_SIGNING_CERT_SHA256 }}
          PROTECTION_ACK: ${{ vars.PURPLE_SIGNING_ENVIRONMENT_PROTECTED }}
        run: |
          set -euo pipefail
          test "$PROTECTION_ACK" = "YES"
          test -n "$KEYSTORE_CIPHERTEXT_B64"
          test "${#STORE_PASSWORD}" -ge 20
          EXPECTED_CERT="$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ]]
          echo "::add-mask::$STORE_PASSWORD"
          umask 077
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$KEYSTORE_CIPHERTEXT_B64" | base64 --decode > "$RUNNER_TEMP/keystore.pccks"
          python3 -m pip install --disable-pip-version-check "cryptography==50.0.2"
          python3 scripts/keystore_crypto.py decrypt "$RUNNER_TEMP/keystore.pccks" "$RUNNER_TEMP/purple-release.jks" --passphrase-file "$RUNNER_TEMP/store.pass"
          keytool -exportcert -alias purple-charm-release -keystore "$RUNNER_TEMP/purple-release.jks" -storepass:file "$RUNNER_TEMP/store.pass" -file "$RUNNER_TEMP/cert.der" >/dev/null 2>&1
          ACTUAL_CERT="$(openssl dgst -sha256 "$RUNNER_TEMP/cert.der" | awk '{print tolower($NF)}')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          test "$ACTUAL_CERT" = 44f2adc5bc2f78dbde2186ab85efa7de79136bf48638f6ac0fde8af7020004f4
          echo "PURPLE_KEYSTORE_PATH=$RUNNER_TEMP/purple-release.jks" >> "$GITHUB_ENV"
          echo "PURPLE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PURPLE_VERSION_CODE=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
          echo "PURPLE_VERSION_NAME=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
          echo "EXPECTED_SIGNING_CERT=$EXPECTED_CERT" >> "$GITHUB_ENV"
      - name: Compilar release com assinatura oficial
        run: gradle :app:assembleRelease --stacktrace
      - name: Validar APK e certificado oficial
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          # Versoes do Android SDK usam nomes distintos (ex.: "V2 Signer" ou "Signer #1").
          # Extrair apenas o SHA-256 do certificado; rejeitar duplicatas e resultados invalidos.
          CERT_OUTPUT="$("$SDK_BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          CERT_DIGESTS="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/^.*[Cc]ertificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+)[[:space:]]*$/\1/p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)"
          ACTUAL_CERT="$CERT_DIGESTS"
          if [[ ! "$ACTUAL_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Falha ao ler um unico digest SHA-256 valido do certificado do APK."
            exit 1
          fi
          test "$ACTUAL_CERT" = "$EXPECTED_SIGNING_CERT" || { echo "Certificado do APK não corresponde ao certificado oficial esperado."; exit 1; }
          BADGING="$("$SDK_BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "versionCode='$CANDIDATE_VERSION'" || { echo "versionCode incorreto."; exit 1; }
          printf '%s\n' "$BADGING" | grep -q "package: name='com.purplecharm.launcher'" || { echo "applicationId incorreto."; exit 1; }
          printf '%s\n' "$BADGING" | grep -F "versionName='$CANDIDATE_VERSION'" || { echo "versionName incorreto."; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/Purple-Charm-v$CANDIDATE_VERSION-OFFICIAL-RELEASE.apk"
          sha256sum "dist/Purple-Charm-v$CANDIDATE_VERSION-OFFICIAL-RELEASE.apk"
      - name: Armazenar APK oficial como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Charm-v${{ env.CANDIDATE_VERSION }}-OFFICIAL-RELEASE
          path: dist/Purple-Charm-v${{ env.CANDIDATE_VERSION }}-OFFICIAL-RELEASE.apk
          if-no-files-found: error
      - name: Apagar chave e senha temporárias
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/purple-release.jks" "$RUNNER_TEMP/keystore.pccks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/cert.der"

  publish-v15:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development/v15-performance' && inputs.publish_existing_v15 == true }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Conferir artefato e publicar v15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=odinwinchester/Purple-charm-launcher
          name=Purple-Charm-v15-OFFICIAL-RELEASE.apk
          sha=07d4102ac4f699e792a9440a42ea9fed980bed15afae511f8fd53d7066aca906
          cd "$RUNNER_TEMP"
          gh run download 45823901095 -R "$repo" -n Purple-Charm-v15-OFFICIAL-RELEASE
          printf '%s  %s\n' "$sha" "$name" | sha256sum -c
          gh api "repos/$repo/releases/459440012" | jq -e '.draft and (.prerelease|not) and .tag_name=="v15" and .target_commitish=="49b9e7794330fe75f3372349e4cd766257495e07" and (.body|contains("versionCode: 15") and contains("versionName: 15"))' >/dev/null
          gh release upload v15 "./$name" -R "$repo"
          gh api "repos/$repo/releases/459440012" | jq -e --arg name "$name" --arg digest "sha256:$sha" '.assets | length==1 and .[0].name==$name and .[0].size==50106455 and .[0].digest==$digest and .[0].state=="uploaded"' >/dev/null
          gh release edit v15 -R "$repo" --draft=false --prerelease=false --latest
