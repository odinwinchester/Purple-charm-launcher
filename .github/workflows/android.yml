name: Compilar Purple Charm Launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir integridade das vinte artes
        run: python3 scripts/verify_weather_artwork.py

      - name: Testar previsão, localização e proporções
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Validar APK e assinatura
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:)"
          PACKAGE_NAME="$("$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE_NAME" = "com.purplecharm.launcher"
          sha256sum "$APK"

      - name: Nomear APK para instalacao
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Purple-Charm-Crystal-Class-v0.7.0.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Charm-Crystal-Class-v0.7.0
          path: dist/*.apk
          if-no-files-found: error
