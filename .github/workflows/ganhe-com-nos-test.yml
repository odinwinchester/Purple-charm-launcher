name: Testar Ganhe com Nós (branch isolada)

on:
  push:
    branches:
      - feature/ganhe-com-nos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify icon catalog
        run: ICON_CATALOG_REF=feature/ganhe-com-nos python3 scripts/update_icon_catalog.py
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Check debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ganhe-com-Nos-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Charm-Ganhe-com-Nos-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
