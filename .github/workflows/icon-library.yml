name: Atualizar biblioteca de icones Purple Charm

on:
  push:
    branches:
      - main
      - feat/automatic-icon-library
    paths:
      - 'icon-library/*.png'
      - 'icon-library/packages.json'
      - 'scripts/update_icon_catalog.py'
      - '.github/workflows/icon-library.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: icon-library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar PNGs e atualizar catalogo
        env:
          ICON_CATALOG_REF: ${{ github.ref_name }}
        run: python3 scripts/update_icon_catalog.py
      - name: Propor atualizacao do catalogo por Pull Request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(icons): update verified remote icon catalog'
          branch: bot/update-icon-catalog
          delete-branch: true
          add-paths: icon-library/catalog.json
          title: 'chore(icons): publicar catalogo de icones validado'
          body: 'Catalogo gerado e validado automaticamente. Integrar apos o status obrigatorio safe-selftests passar.'
