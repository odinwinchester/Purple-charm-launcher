name: Atualizar biblioteca de icones Purple Charm

on:
  push:
    branches:
      - main
      - feat/icon-inbox-publisher
      - icon-library-publishing
    paths:
      - 'icon-library/*.png'
      - 'icon-library/inbox/*.png'
      - 'icon-library/packages.json'
      - 'scripts/import_icon_inbox.py'
      - 'scripts/update_icon_catalog.py'
      - '.github/workflows/icon-library.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: icon-library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar validador PNG
        run: python3 -m pip install Pillow==11.3.0
      - name: Importar imagens aprovadas e atualizar catalogo
        env:
          ICON_CATALOG_REF: ${{ github.ref_name == 'icon-library-publishing' && 'icon-library-publishing' || 'main' }}
        run: |
          python3 scripts/import_icon_inbox.py
          python3 scripts/update_icon_catalog.py
      - name: Propor publicacao segura na main
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(icons): publish validated remote icons'
          branch: bot/publish-icon-inbox
          delete-branch: true
          add-paths: |
            icon-library/*.png
            icon-library/inbox/*.png
            icon-library/packages.json
            icon-library/catalog.json
          title: 'chore(icons): publicar icones validados'
          body: 'Imagens verificadas automaticamente. A main protegida exige revisao/merge conforme as regras do repositorio.'
      - name: Registrar alteracoes na branch de testes
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-library
          if ! git diff --cached --quiet; then
            git commit -m "chore(icons): validate and stage uploaded icons"
            git push
          fi
